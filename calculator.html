<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Calculator</title>
    <style>
        body{
            font-family: Arial, Helvetica, sans-serif;
            display: flex;
            justify-content: center;
            margin-top: 100px;
            
        }
        .calculator{
            width: 200px;
            background-color: rgb(5, 5, 5);
            padding: 28px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(65, 62, 62, 0.3);
        }
        #display{
            width: 100%;
            height:40px;
            font-size: 24px;
            text-align: right;
            margin-bottom: 15px;
            box-sizing: border-box;
            padding: 5px;
            background-color: rgb(205, 45, 45);
            color: #f6f4f4;
            border-radius: 10px;
            border: none;
        }
        .buttons {
            display: grid;
            grid-template-columns: repeat(4 , 1fr);
            gap: 10px;
        }
        button{
            height: 40px; 
            font-size: 18px;
            cursor: pointer;
            border: none;
            border-radius: 8px;
            background-color: #878689;
            color: aliceblue;
            transition: background-color 0.5s ease;
        }
        button:hover{
            background-color: rgb(33, 31, 30);
        }
        button:active{
            background-color: rgb(242, 242, 244);
        }
        #equals{
            background-color: rgb(213, 72, 17);
        }
        #equals:hover{
            background-color:  rgb(33, 31, 30);
        }

        #clear{
            grid-column: span 4;
            background-color: rgb(255, 68, 0);
        }
        #clear:hover{
            background-color:  rgb(33, 31, 30);
        }


    </style>
</head>
<body>
    <div class="calculator">
        <input type="text" id="display" disabled>
        <div class="buttons">
            <button class="btn" data-value="7">7</button>
            <button class="btn" data-value="8">8</button>
            <button class="btn" data-value="9">9</button>
            <button class="btn" data-value="/">/</button>

            <button class="btn" data-value="4">4</button>
            <button class="btn" data-value="5">5</button>
            <button class="btn" data-value="6">6</button>
            <button class="btn" data-value="*">*</button>

            <button class="btn" data-value="1">1</button>
            <button class="btn" data-value="2">2</button>
            <button class="btn" data-value="3">3</button>
            <button class="btn" data-value="-">-</button>

            <button class="btn" data-value="0">0</button>
            <button class="btn" data-value=".">.</button>
            <button id="equals" data-value="equals">=</button>
            <button class="btn" data-value="+">+</button>

            <button id="clear"> clear</button>

        </div>

    </div>
    <script>
        let display = document.getElementById("display");
        let buttons = document.querySelectorAll(".btn");

        buttons.forEach(function(button){
            button.addEventListener("click", function(){
                display.value = display.value + button.getAttribute("data-value");
            });
        });


       let clearbtn = document.getElementById("clear");
       clearbtn.addEventListener( "click", function(){
        display.value = "";
        });

        

        let equalsbtn = document.getElementById("equals");
        equalsbtn.addEventListener("click", function(){

        try{
                let result = eval(display.value);
                display.value = result;
            }catch (error){
                display.value = "Error";
            }

        });
        
       
    </script>
</body>

</html>
